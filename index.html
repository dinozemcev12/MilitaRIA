<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilitaRIA — Grand Strategy & Tactical Warfare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">ИНИЦИАЛИЗАЦИЯ МИЛИТАРИА...</div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
    </div>

    <div id="app" class="hidden">
        <!-- Top Bar -->
        <header id="top-bar">
            <div class="top-left">
                <div id="game-date" class="top-item">1 января 2000</div>
                <div class="top-divider"></div>
                <button id="country-selector" class="top-item country-btn">
                    <span class="country-flag" id="player-flag"></span>
                    <span class="country-name" id="player-name">США</span>
                    <span class="caret">▼</span>
                </button>
            </div>
            <div class="top-center">
                <div class="top-stat" id="stat-stability"><span class="stat-label">СТАБИЛЬНОСТЬ</span><span class="stat-value" id="val-stability">—</span></div>
                <div class="top-stat" id="stat-gdp"><span class="stat-label">ВВП</span><span class="stat-value" id="val-gdp">—</span></div>
                <div class="top-stat" id="stat-pop"><span class="stat-label">НАСЕЛЕНИЕ</span><span class="stat-value" id="val-pop">—</span></div>
                <div class="top-stat" id="stat-mil"><span class="stat-label">АРМИЯ</span><span class="stat-value" id="val-mil">—</span></div>
                <div class="top-stat" id="stat-treasury"><span class="stat-label">КАЗНА</span><span class="stat-value" id="val-treasury">—</span></div>
            </div>
            <div class="top-right">
                <div class="speed-control" id="speed-control">
                    <button class="speed-btn" data-speed="0" title="Пауза (Space)">⏸</button>
                    <button class="speed-btn active" data-speed="1" title="x1">1</button>
                    <button class="speed-btn" data-speed="2" title="x2">2</button>
                    <button class="speed-btn" data-speed="4" title="x4">4</button>
                    <button class="speed-btn" data-speed="8" title="x8">8</button>
                </div>
            </div>
        </header>

        <!-- Main Layout -->
        <div id="main-layout">
            <!-- Left Panel - Modules -->
            <aside id="left-panel" class="panel">
                <div class="panel-header">
                    <h3>УПРАВЛЕНИЕ</h3>
                    <button class="panel-toggle" data-panel="left">◀</button>
                </div>
                <nav class="module-nav">
                    <button class="nav-btn active" data-module="overview">Обзор</button>
                    <button class="nav-btn" data-module="politics">Политика</button>
                    <button class="nav-btn" data-module="economy">Экономика</button>
                    <button class="nav-btn" data-module="military">Армия</button>
                    <button class="nav-btn" data-module="diplomacy">Дипломатия</button>
                    <button class="nav-btn" data-module="technology">Технологии</button>
                    <button class="nav-btn" data-module="intelligence">Разведка</button>
                </nav>
                <div id="module-content" class="module-content"></div>
            </aside>

            <!-- Map Viewport -->
            <main id="map-viewport">
                <canvas id="map-canvas"></canvas>
                <div id="map-overlay" class="map-tooltip"></div>
                <div id="province-info" class="province-panel hidden"></div>
            </main>

            <!-- Right Panel - Events/News -->
            <aside id="right-panel" class="panel">
                <div class="panel-header">
                    <h3>СОБЫТИЯ</h3>
                    <button class="panel-toggle" data-panel="right">▶</button>
                </div>
                <div class="panel-tabs">
                    <button class="tab-btn active" data-tab="news">Новости</button>
                    <button class="tab-btn" data-tab="events">События</button>
                    <button class="tab-btn" data-tab="log">Журнал</button>
                </div>
                <div class="panel-content">
                    <div id="tab-news" class="tab-content">
                        <div id="news-list" class="news-list"></div>
                    </div>
                    <div id="tab-events" class="tab-content hidden">
                        <div id="events-list" class="events-list"></div>
                    </div>
                    <div id="tab-log" class="tab-content hidden">
                        <div id="event-log" class="event-log"></div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Bottom Bar -->
        <footer id="bottom-bar">
            <div class="bottom-left">
                <span id="game-speed-label">x1</span>
                <span class="divider"></span>
                <span id="selection-info">Ничего не выбрано</span>
            </div>
            <div class="bottom-center">
                <button id="btn-save" class="icon-btn" title="Сохранить (F5)">💾</button>
                <button id="btn-load" class="icon-btn" title="Загрузить (F9)">📂</button>
                <button id="btn-menu" class="icon-btn" title="Меню (Esc)">☰</button>
            </div>
            <div class="bottom-right">
                <div id="alert-container"></div>
            </div>
        </footer>

        <!-- Country Selector Modal -->
        <div id="country-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-window">
                <div class="modal-header">
                    <h3>ВЫБОР СТРАНЫ</h3>
                    <button class="modal-close">✕</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="country-search" placeholder="Поиск страны...">
                    <div id="country-list" class="country-list"></div>
                </div>
            </div>
        </div>

        <!-- Event Decision Modal -->
        <div id="event-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-window event-window">
                <div class="modal-header">
                    <h3 id="event-title">СОБЫТИЕ</h3>
                </div>
                <div class="modal-body">
                    <div id="event-description"></div>
                    <div id="event-options"></div>
                </div>
            </div>
        </div>

        <!-- Tactical Combat Modal -->
        <div id="tactical-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-window tactical-window">
                <div class="tactical-header">
                    <h3 id="tactical-title">ТАКТИЧЕСКОЕ СРАЖЕНИЕ</h3>
                    <div class="tactical-controls">
                        <button id="tactical-pause" class="tactical-btn">⏸</button>
                        <button id="tactical-speed-1" class="tactical-btn active">1x</button>
                        <button id="tactical-speed-2" class="tactical-btn">2x</button>
                        <button id="tactical-speed-4" class="tactical-btn">4x</button>
                        <button id="tactical-exit" class="tactical-btn danger">ВЫХОД</button>
                    </div>
                </div>
                <div class="tactical-body">
                    <canvas id="tactical-canvas"></canvas>
                    <div id="tactical-sidebar">
                        <div id="tactical-units"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/core/Engine.js"></script>
    <script src="js/core/Country.js"></script>
    <script src="js/data/countries.js"></script>
    <script src="js/map/Map.js"></script>
    <script src="js/map/Provinces.js"></script>
    <script src="js/ui/UI.js"></script>
    <script src="js/systems/EconomySystem.js"></script>
    <script src="js/systems/PoliticsSystem.js"></script>
    <script src="js/systems/MilitarySystem.js"></script>
    <script src="js/systems/DiplomacySystem.js"></script>
    <script src="js/systems/TechnologySystem.js"></script>
    <script src="js/systems/IntelligenceSystem.js"></script>
    <script src="js/systems/EventSystem.js"></script>
    <script src="js/tactical/TacticalEngine.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
